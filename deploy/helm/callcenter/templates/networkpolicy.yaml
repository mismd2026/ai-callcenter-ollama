{{- if .Values.networkPolicy.enabled }}
# Model servers accept traffic only from the API pods and have no egress to the
# internet (except DNS). Caller audio and transcripts cannot leave the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cc.name" . }}-models-isolation
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [ollama, voicevox] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/component: api } }
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
{{- end }}
