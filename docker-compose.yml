# Single-node setup for local development / PoC.
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b-instruct
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      VOICEVOX_URL: http://voicevox:50021
      WHISPER_MODEL: small        # use medium/large-v3 on GPU nodes
      WHISPER_DEVICE: cpu
      # Recorder bundles (#5): address the customer's recorder connects to,
      # and the sha256 of the admin token (admin API is off when empty).
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      ADMIN_TOKEN_SHA256: ${ADMIN_TOKEN_SHA256:-}
      STATE_DIR: /app/state
    depends_on: [ollama, voicevox, db]
    volumes:
      - hf-cache:/home/app/.cache/huggingface
      - state:/app/state

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    # Uncomment on a host with an NVIDIA GPU + nvidia-container-toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: callcenter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  ollama: {}
  pg: {}
  hf-cache: {}
  state: {}
