[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-callcenter-ollama"
version = "0.1.0"
description = "Self-hosted AI call center: faster-whisper STT + Ollama LLM + VOICEVOX TTS with RAG FAQ and 3-layer escalation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy runtime models are optional so that tests and CI run on a laptop without GPU.
speech = ["faster-whisper>=1.0"]
embeddings = ["sentence-transformers>=2.7"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "recorder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
